services:
  db:
    image: postgres:15-alpine
    container_name: flux_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5021}:5432"
    volumes:
      - flux_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flux-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    container_name: flux_init
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: flux_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_TRUST_HOST: "true"
      PORT: ${PORT:-5020}
    ports:
      - "${PORT:-5020}:${PORT:-5020}"
    volumes:
      - flux_uploads:/app/public/uploads
    depends_on:
      flux-init:
        condition: service_completed_successfully

volumes:
  flux_pgdata:
  flux_uploads:
