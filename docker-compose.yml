services:
  flux-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    container_name: flux_init
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: flux_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_TRUST_HOST: "true"
      PORT: ${PORT:-5020}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-5020}:${PORT:-5020}"
    volumes:
      - flux_uploads:/app/public/uploads
    depends_on:
      flux-init:
        condition: service_completed_successfully

volumes:
  flux_uploads:
