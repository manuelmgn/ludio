<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ludio-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="48%" stop-color="#140c29" />
      <stop offset="100%" stop-color="#08080f" />
    </linearGradient>
    <radialGradient id="ludio-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 14) rotate(48) scale(52)">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#7e22ce" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#08080d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ludio-cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(47 18) rotate(135) scale(24)">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ludio-border" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="ludio-letter" x1="16" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ludio-spark" x1="36" y1="13" x2="51" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Obsidian Glass Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ludio-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ludio-glow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ludio-cyan-glow)" />

  <!-- Subtle top glass specular highlight -->
  <path d="M18 3.5H46C53.4558 3.5 59.5 9.54416 59.5 17V18C59.5 11.5 53.5 6 46 6H18C10.5 6 4.5 11.5 4.5 18V17C4.5 9.54416 10.5442 3.5 18 3.5Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Crisp Gradient Border -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#ludio-border)" stroke-width="1.5" />

  <!-- Geometric L Monogram (Cartridge / Arcade Keycap silhouette) -->
  <path
    d="M18 16.5C18 15.1193 19.1193 14 20.5 14H26.5C27.8807 14 29 15.1193 29 16.5V39H46.5C47.8807 39 49 40.1193 49 41.5V47.5C49 48.8807 47.8807 50 46.5 50H23.5C20.4624 50 18 47.5376 18 44.5V16.5Z"
    fill="url(#ludio-letter)"
  />
  <!-- Subtle inner notch detail on the L stem (retro cartridge groove) -->
  <rect x="21.5" y="18" width="4" height="4" rx="1" fill="#7e22ce" fill-opacity="0.32" />

  <!-- Glowing Play / Pixel Spark in upper-right negative space -->
  <path
    d="M42.5 14L48.5 20L42.5 26L36.5 20L42.5 14Z"
    fill="url(#ludio-spark)"
  />
  <!-- Secondary micro pixel accent -->
  <rect x="35" y="29" width="5" height="5" rx="1.5" fill="#c084fc" fill-opacity="0.85" />
</svg>
