<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="52%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#1e103d" />
    </linearGradient>
    <radialGradient id="fav-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(48 16) rotate(135) scale(34)">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fav-border" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="fav-spark" x1="34" y1="10" x2="54" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Vibrant Electric Violet Squircle (pops on both dark & light browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-cyan)" />
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="url(#fav-border)" stroke-width="2" />

  <!-- Bold, razor-sharp pure white L monogram -->
  <path
    d="M15 15C15 13.3431 16.3431 12 18 12H26C27.6569 12 29 13.3431 29 15V37H48C49.6569 37 51 38.3431 51 40V48C51 49.6569 49.6569 51 48 51H21C17.6863 51 15 48.3137 15 45V15Z"
    fill="#ffffff"
  />

  <!-- Crisp Neon Cyan Play-Diamond Spark -->
  <path
    d="M43 11L52 20L43 29L34 20L43 11Z"
    fill="url(#fav-spark)"
  />
</svg>
